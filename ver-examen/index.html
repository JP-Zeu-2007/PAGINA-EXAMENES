<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen de Computación - Consulta</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        .caja {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 900px;
            padding: 28px;
        }
        .cabecera {
            text-align: center;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }
        .cabecera h1 {
            color: #4f46e5;
            margin: 0 0 4px 0;
            font-size: 1.5rem;
        }
        .cabecera p {
            margin: 4px 0;
            color: #6b7280;
            font-size: 0.9rem;
        }
        .datos-alumno {
            background: #eef2ff;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 18px;
        }
        .datos-alumno p {
            margin: 4px 0;
            color: #374151;
        }
        .datos-alumno strong {
            color: #1f2937;
        }
        .visor-pdf {
            width: 100%;
            height: 80vh;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
        }
        .visor-pdf iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        .btn-descargar {
            display: inline-block;
            margin-top: 14px;
            padding: 12px 22px;
            background: #4f46e5;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.15s;
        }
        .btn-descargar:hover {
            background: #4338ca;
        }
        .mensaje-error {
            text-align: center;
            padding: 40px 20px;
            color: #dc2626;
            font-weight: 600;
            font-size: 1.05rem;
        }
        .cargando {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

<div class="caja" id="caja">
    <div class="cargando" id="estado">⏳ Cargando información del examen...</div>
</div>

<script>
    const SUPABASE_URL = 'https://eqhlrmonlrdgskjsiueb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxaGxybW9ubHJkZ3NranNpdWViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMTYwMzMsImV4cCI6MjEwNTY5MjAzM30.YJpjDzOK19QMNW22qDrgIZzO5sRbmSPqtBFds1YpbJQ';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function obtenerNombreGrado(gradoNum) {
        switch(String(gradoNum).trim()) {
            case '2': return 'Segundo Primaria';
            case '3': return 'Tercer Primaria';
            case '4': return 'Cuarto Primaria';
            case '5': return 'Quinto Primaria';
            case '6': return 'Sexto Primaria';
            default: return `${gradoNum}° Primaria`;
        }
    }

    async function cargarExamen() {
        const caja = document.getElementById('caja');
        const params = new URLSearchParams(window.location.search);
        const codigo = params.get('codigo');

        if (!codigo) {
            caja.innerHTML = '<div class="mensaje-error">❌ No se proporcionó un código de estudiante válido.</div>';
            return;
        }

        const { data: est, error: errorEst } = await _supabase
            .from('estudiantes')
            .select('*')
            .eq('codigo', codigo)
            .maybeSingle();

        if (errorEst || !est) {
            caja.innerHTML = '<div class="mensaje-error">❌ No se encontró al estudiante con ese código.</div>';
            return;
        }

        const { data: examen, error: errorExamen } = await _supabase
            .from('resultados_evaluacion')
            .select('*')
            .eq('codigo_estudiante', codigo)
            .maybeSingle();

        if (errorExamen || !examen) {
            caja.innerHTML = `
                <div class="cabecera">
                    <h1>📋 Examen de Computación</h1>
                    <p>Evaluación Virtual - Cuarto Bimestre</p>
                </div>
                <div class="datos-alumno">
                    <p><strong>Estudiante:</strong> ${est.nombres} ${est.apellidos}</p>
                    <p><strong>Grado:</strong> ${obtenerNombreGrado(est.grado)}</p>
                </div>
                <div class="mensaje-error">
                    ⏳ El examen aún no ha sido calificado por el docente.<br>
                    Por favor, intenta más tarde.
                </div>
            `;
            return;
        }

        if (!examen.pdf_url) {
            caja.innerHTML = `
                <div class="cabecera">
                    <h1>📋 Examen de Computación</h1>
                    <p>Evaluación Virtual - Cuarto Bimestre</p>
                </div>
                <div class="datos-alumno">
                    <p><strong>Estudiante:</strong> ${est.nombres} ${est.apellidos}</p>
                    <p><strong>Grado:</strong> ${obtenerNombreGrado(est.grado)}</p>
                    <p><strong>Punteo:</strong> ${(examen.punteo_total || 0) + (examen.punteo_extra || 0)} / 40 pts</p>
                </div>
                <div class="mensaje-error">
                    ⏳ El PDF del examen aún no ha sido publicado.<br>
                    Por favor, contacta al docente.
                </div>
            `;
            return;
        }

        const total = (examen.punteo_total || 0) + (examen.punteo_extra || 0);

        caja.innerHTML = `
            <div class="cabecera">
                <h1>📋 Examen de Computación</h1>
                <p>Evaluación Virtual - Cuarto Bimestre</p>
            </div>
            <div class="datos-alumno">
                <p><strong>Estudiante:</strong> ${est.nombres} ${est.apellidos}</p>
                <p><strong>Grado:</strong> ${obtenerNombreGrado(est.grado)}</p>
                <p><strong>Punteo:</strong> ${total} / 40 pts</p>
            </div>
            <div class="visor-pdf">
                <iframe src="${examen.pdf_url}#toolbar=1&navpanes=0"></iframe>
            </div>
            <div style="text-align:center;">
                <a href="${examen.pdf_url}" target="_blank" class="btn-descargar">📥 Descargar PDF</a>
            </div>
        `;
    }

    cargarExamen();
</script>

</body>
</html>
