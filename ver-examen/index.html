<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen de Computación - Consulta</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        .caja {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 900px;
            padding: 28px;
        }
        .cabecera {
            text-align: center;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }
        .cabecera h1 {
            color: #4f46e5;
            margin: 0 0 4px 0;
            font-size: 1.5rem;
        }
        .cabecera p {
            margin: 4px 0;
            color: #6b7280;
            font-size: 0.9rem;
        }
        .datos-alumno {
            background: #eef2ff;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 18px;
        }
        .datos-alumno p {
            margin: 4px 0;
            color: #374151;
        }
        .datos-alumno strong {
            color: #1f2937;
        }
        .visor-imagen {
            width: 100%;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
            background: #f9fafb;
            padding: 10px;
            text-align: center;
            margin-bottom: 18px;
        }
        .visor-imagen img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
        }
        .btn-descargar {
            display: inline-block;
            margin-top: 14px;
            padding: 12px 22px;
            background: #4f46e5;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.15s;
        }
        .btn-descargar:hover {
            background: #4338ca;
        }
        .mensaje-error {
            text-align: center;
            padding: 40px 20px;
            color: #dc2626;
            font-weight: 600;
            font-size: 1.05rem;
        }
        .cargando {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
            font-size: 1.05rem;
        }

        /* ============ SERIE IV ESCRITURA (2DO) ============ */
        .seccion-serie4 {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 2px solid #e5e7eb;
        }
        .seccion-serie4 h2 {
            color: #4f46e5;
            font-size: 1.2rem;
            margin: 0 0 4px 0;
        }
        .seccion-serie4 p.subtitulo {
            color: #6b7280;
            font-size: 0.9rem;
            margin: 4px 0 16px 0;
        }

        .datos-alumno-box {
            background: #eef2ff;
            border-left: 4px solid #4f46e5;
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        .datos-alumno-box p {
            margin: 4px 0;
            font-size: 0.95rem;
            color: #1f2937;
        }
        .datos-alumno-box strong { color: #4f46e5; }

        .subtitulo-serie4 {
            font-weight: bold;
            color: #4f46e5;
            font-size: 1rem;
            margin: 16px 0 8px 0;
            padding-bottom: 4px;
            border-bottom: 2px solid #e5e7eb;
        }

        .fila-detalle {
            display: grid;
            grid-template-columns: 30px 1fr 1fr 90px;
            gap: 8px;
            padding: 8px 10px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 0.9rem;
            align-items: center;
        }
        .fila-detalle:last-child { border-bottom: none; }
        .fila-detalle.header {
            background: #eef2ff;
            font-weight: bold;
            color: #4f46e5;
            border-radius: 6px 6px 0 0;
            border-bottom: 2px solid #4f46e5;
        }
        .fila-detalle.correcto { background: #ecfdf5; }
        .fila-detalle.incorrecto { background: #fef2f2; }

        .celda-num {
            font-weight: bold;
            color: #6b7280;
            text-align: center;
        }
        .celda-palabra {
            font-weight: 600;
            color: #1f2937;
            text-transform: capitalize;
        }
        .celda-escrito {
            color: #4b5563;
            font-family: 'Courier New', monospace;
            background: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #e5e7eb;
            display: inline-block;
            min-width: 60px;
            text-align: center;
        }
        .celda-errores {
            text-align: center;
            font-weight: bold;
        }
        .errores-0 { color: #059669; }
        .errores-1 { color: #d97706; }
        .errores-2mas { color: #dc2626; }

        .resumen-serie4 {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
            border-radius: 6px;
            padding: 12px 16px;
            margin-top: 16px;
            font-size: 0.95rem;
            color: #1e40af;
        }
        .resumen-serie4 strong { color: #1e40af; }

        .teclas-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .tecla-item {
            background: #fff;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 8px 12px;
            text-align: center;
            min-width: 70px;
        }
        .tecla-item .tecla-letra {
            font-size: 1.3rem;
            font-weight: 900;
            color: #1f2937;
        }
        .tecla-item.correcto {
            border-color: #10b981;
            background: #ecfdf5;
        }
        .tecla-item.incorrecto {
            border-color: #dc2626;
            background: #fef2f2;
        }
        .tecla-item .errores-txt {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 2px;
        }

        /* Sección de capturas PPT */
        .seccion-capturas-ppt {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 2px solid #e5e7eb;
        }
        .seccion-capturas-ppt h2 {
            color: #4f46e5;
            font-size: 1.2rem;
            margin: 0 0 4px 0;
        }
        .seccion-capturas-ppt p {
            color: #6b7280;
            font-size: 0.9rem;
            margin: 4px 0 16px 0;
        }
        .capturas-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .captura-item {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px;
        }
        .captura-titulo {
            font-weight: bold;
            color: #4f46e5;
            font-size: 0.95rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .captura-titulo .num {
            background: #4f46e5;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }
        .captura-item img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            display: block;
        }
        .captura-vacia {
            background: #fef3c7;
            border: 2px dashed #f59e0b;
            color: #92400e;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-style: italic;
            font-size: 0.9rem;
        }
        .aviso-ppt {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
            padding: 12px 16px;
            border-radius: 6px;
            color: #1e40af;
            margin-bottom: 16px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .seccion-gmail {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 2px solid #e5e7eb;
        }
        .seccion-gmail h2 {
            color: #ea4335;
            font-size: 1.2rem;
            margin: 0 0 4px 0;
        }
        .seccion-gmail p {
            color: #6b7280;
            font-size: 0.9rem;
            margin: 4px 0 16px 0;
        }
    </style>
</head>
<body>

<div class="caja" id="caja">
    <div class="cargando" id="estado">⏳ Cargando información del examen...</div>
</div>

<script>
    const SUPABASE_URL = 'https://eqhlrmonlrdgskjsiueb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxaGxybW9ubHJkZ3NranNpdWViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMTYwMzMsImV4cCI6MjEwNTY5MjAzM30.YJpjDzOK19QMNW22qDrgIZzO5sRbmSPqtBFds1YpbJQ';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function obtenerNombreGrado(gradoNum) {
        switch(String(gradoNum).trim()) {
            case '2': return 'Segundo Primaria';
            case '3': return 'Tercer Primaria';
            case '4': return 'Cuarto Primaria';
            case '5': return 'Quinto Primaria';
            case '6': return 'Sexto Primaria';
            default: return `${gradoNum}° Primaria`;
        }
    }

    async function cargarExamen() {
        const caja = document.getElementById('caja');
        const params = new URLSearchParams(window.location.search);
        const codigo = params.get('codigo');

        if (!codigo) {
            caja.innerHTML = '<div class="mensaje-error">❌ No se proporcionó un código de estudiante válido.</div>';
            return;
        }

        // 1) Buscar estudiante
        const { data: est, error: errorEst } = await _supabase
            .from('estudiantes').select('*').eq('codigo', codigo).maybeSingle();

        if (errorEst || !est) {
            caja.innerHTML = '<div class="mensaje-error">❌ No se encontró al estudiante con ese código.</div>';
            return;
        }

        // 2) Buscar examen
        const { data: examen, error: errorExamen } = await _supabase
            .from('resultados_evaluacion').select('*').eq('codigo_estudiante', codigo).maybeSingle();

        if (errorExamen || !examen) {
            caja.innerHTML = `
                <div class="cabecera">
                    <h1>📋 Examen de Computación</h1>
                    <p>Evaluación Virtual - Cuarto Bimestre</p>
                </div>
                <div class="datos-alumno">
                    <p><strong>Estudiante:</strong> ${est.nombres} ${est.apellidos}</p>
                    <p><strong>Grado:</strong> ${obtenerNombreGrado(est.grado)}</p>
                </div>
                <div class="mensaje-error">
                    ⏳ El examen aún no ha sido calificado por el docente.<br>
                    Por favor, intenta más tarde.
                </div>
            `;
            return;
        }

        // 3) Buscar detalle
        const { data: detalle } = await _supabase
            .from('detalle_respuestas').select('*').eq('codigo_estudiante', codigo)
            .order('fecha_envio', { ascending: false }).limit(1).maybeSingle();

        // 4) Capturas del PowerPoint
        let capturasPPT = [];
        if (detalle && detalle.token_capturador) {
            const { data: caps } = await _supabase
                .from('capturas_powerpoint')
                .select('*')
                .eq('token', detalle.token_capturador)
                .order('numero_diapositiva');
            capturasPPT = caps || [];
        }

        const esGradoPPT = ['4', '5', '6'].includes(String(est.grado).trim());
        const esGrado5to = String(est.grado).trim() === '5';
        const esGrado2do = String(est.grado).trim() === '2';
        const gmailCaptura = detalle ? detalle.gmail_captura_url : null;

        // Si no hay imagen del examen subida aún
        if (!examen.pdf_url) {
            caja.innerHTML = `
                <div class="cabecera">
                    <h1>📋 Examen de Computación</h1>
                    <p>Evaluación Virtual - Cuarto Bimestre</p>
                </div>
                <div class="datos-alumno">
                    <p><strong>Estudiante:</strong> ${est.nombres} ${est.apellidos}</p>
                    <p><strong>Grado:</strong> ${obtenerNombreGrado(est.grado)}</p>
                    <p><strong>Punteo:</strong> ${(examen.punteo_total || 0) + (examen.punteo_extra || 0)} / 40 pts</p>
                </div>
                <div class="mensaje-error">
                    ⏳ El examen aún no ha sido publicado por el docente.<br>
                    Por favor, contacta al docente.
                </div>
            `;
            return;
        }

        const total = (examen.punteo_total || 0) + (examen.punteo_extra || 0);

        // ============ CAPTURAS PPT ============
        let capturasPPTHtml = '';
        if (esGradoPPT) {
            let items = '';

            if (capturasPPT.length === 0) {
                capturasPPTHtml = `
                    <div class="seccion-capturas-ppt">
                        <h2>📸 Capturas de la Presentación de PowerPoint</h2>
                        <p>Presentación con 6 diapositivas sobre las comidas más famosas del mundo.</p>
                        <div class="captura-vacia">
                            ⚠️ No hay capturas del PowerPoint disponibles.
                        </div>
                    </div>
                `;
            } else {
                for (let i = 1; i <= 6; i++) {
                    const cap = capturasPPT.find(c => c.numero_diapositiva === i);
                    if (cap) {
                        items += `
                            <div class="captura-item">
                                <div class="captura-titulo">
                                    <span class="num">${i}</span>
                                    Diapositiva ${i}
                                </div>
                                <img src="${cap.url_captura}" alt="Diapositiva ${i}" loading="lazy">
                            </div>
                        `;
                    } else {
                        items += `
                            <div class="captura-item">
                                <div class="captura-titulo">
                                    <span class="num">${i}</span>
                                    Diapositiva ${i}
                                </div>
                                <div class="captura-vacia" style="padding:14px; font-size:0.85rem;">
                                    Sin captura
                                </div>
                            </div>
                        `;
                    }
                }

                capturasPPTHtml = `
                    <div class="seccion-capturas-ppt">
                        <h2>📸 Capturas de la Presentación de PowerPoint</h2>
                        <p>Presentación con 6 diapositivas sobre las comidas más famosas del mundo.</p>
                        <div class="aviso-ppt">
                            📊 Capturas recibidas: ${capturasPPT.length} / 6
                        </div>
                        <div class="capturas-grid">
                            ${items}
                        </div>
                    </div>
                `;
            }
        }

        // ============ SERIE IV ESCRITURA (2DO) ============
        let serie4EscrituraHtml = '';
        if (esGrado2do && detalle) {
            const escritura = detalle.serie4_escritura_json || null;
            const teclas = detalle.serie4_teclas_json || null;

            if (escritura || teclas) {
                // ===== Datos del alumno =====
                let datosAlumnoHtml = '';
                if (escritura && escritura.datos_alumno) {
                    datosAlumnoHtml = `
                        <div class="datos-alumno-box">
                            <p><strong>👤 Nombre:</strong> ${escritura.datos_alumno.nombre || '-'}</p>
                            <p><strong>🎓 Grado:</strong> ${escritura.datos_alumno.grado || '-'}</p>
                            <p><strong>🌎 País:</strong> ${escritura.datos_alumno.pais || '-'}</p>
                        </div>
                    `;
                }

                // ===== Tabla de palabras =====
                let palabrasHtml = '';
                if (escritura && escritura.palabras && escritura.palabras.length > 0) {
                    let filas = '';
                    escritura.palabras.forEach((p, i) => {
                        const errores = p.intentos_fallidos || 0;
                        let claseErrores = 'errores-0';
                        let textoErrores = '✓ Sin errores';
                        if (errores === 1) {
                            claseErrores = 'errores-1';
                            textoErrores = '⚠️ 1 error';
                        } else if (errores >= 2) {
                            claseErrores = 'errores-2mas';
                            textoErrores = `❌ ${errores} errores`;
                        }
                        const claseFila = errores === 0 ? 'correcto' : 'incorrecto';
                        filas += `
                            <div class="fila-detalle ${claseFila}">
                                <div class="celda-num">${i + 1}</div>
                                <div class="celda-palabra">${p.palabra}</div>
                                <div><span class="celda-escrito">${p.escritura_final || '-'}</span></div>
                                <div class="celda-errores ${claseErrores}">${textoErrores}</div>
                            </div>
                        `;
                    });

                    palabrasHtml = `
                        <div class="subtitulo-serie4">✍️ Escritura de palabras (${escritura.punteo_escritura || 0} / 5 pts)</div>
                        <div class="fila-detalle header">
                            <div>#</div>
                            <div>Palabra</div>
                            <div>Escribió</div>
                            <div>Errores</div>
                        </div>
                        ${filas}
                    `;
                }

                // ===== Teclas =====
                let teclasHtml = '';
                if (teclas && teclas.teclas && teclas.teclas.length > 0) {
                    let items = '';
                    teclas.teclas.forEach(t => {
                        const errores = t.intentos_fallidos || 0;
                        const clase = errores === 0 ? 'correcto' : 'incorrecto';
                        const textoErrores = errores === 0 ? '✓' : `❌ ${errores}`;
                        items += `
                            <div class="tecla-item ${clase}">
                                <div class="tecla-letra">${t.tecla}</div>
                                <div class="errores-txt">${textoErrores}</div>
                            </div>
                        `;
                    });

                    teclasHtml = `
                        <div class="subtitulo-serie4">⌨️ Presionar teclas (${teclas.punteo_teclas || 0} / 5 pts)</div>
                        <div class="teclas-grid">
                            ${items}
                        </div>
                    `;
                }

                // ===== Resumen =====
                let resumenHtml = '';
                if (escritura && teclas) {
                    const totalErrores = (escritura.palabras || []).reduce((s, p) => s + (p.intentos_fallidos || 0), 0) +
                                         (teclas.teclas || []).reduce((s, t) => s + (t.intentos_fallidos || 0), 0);
                    const punteoTotal = (escritura.punteo_escritura || 0) + (teclas.punteo_teclas || 0);
                    resumenHtml = `
                        <div class="resumen-serie4">
                            <strong>📊 Resumen:</strong> 
                            Punteo Serie IV: <strong>${punteoTotal.toFixed(1)} / 10</strong> · 
                            Total de errores: <strong>${totalErrores}</strong>
                        </div>
                    `;
                }

                serie4EscrituraHtml = `
                    <div class="seccion-serie4">
                        <h2>✍️ Serie IV: Escritura y Teclas</h2>
                        <p class="subtitulo">Detalle de las palabras escritas y las teclas presionadas por el estudiante.</p>
                        ${datosAlumnoHtml}
                        ${palabrasHtml}
                        ${teclasHtml}
                        ${resumenHtml}
                    </div>
                `;
            }
        }

        // ============ GMAIL ============
        let gmailHtml = '';
        if (esGrado5to && gmailCaptura) {
            gmailHtml = `
                <div class="seccion-gmail">
                    <h2>📧 Práctica en el Simulador de Gmail</h2>
                    <p>Creación de 5 cuentas de Google (práctica previa al envío del correo real).</p>
                    <div class="visor-imagen">
                        <img src="${gmailCaptura}" alt="Captura del simulador de Gmail">
                    </div>
                </div>
            `;
        }

        // ============ MOSTRAR TODO ============
        caja.innerHTML = `
            <div class="cabecera">
                <h1>📋 Examen de Computación</h1>
                <p>Evaluación Virtual - Cuarto Bimestre</p>
            </div>
            <div class="datos-alumno">
                <p><strong>Estudiante:</strong> ${est.nombres} ${est.apellidos}</p>
                <p><strong>Grado:</strong> ${obtenerNombreGrado(est.grado)}</p>
                <p><strong>Punteo:</strong> ${total} / 40 pts</p>
            </div>

            <div class="visor-imagen">
                <img src="${examen.pdf_url}" alt="Examen de ${est.nombres}">
            </div>
            <div style="text-align:center;">
                <a href="${examen.pdf_url}" target="_blank" download="examen_${est.codigo}.png" class="btn-descargar">
                    📥 Descargar Imagen del Examen
                </a>
            </div>

            ${serie4EscrituraHtml}
            ${capturasPPTHtml}
            ${gmailHtml}
        `;
    }

    cargarExamen();
</script>

</body>
</html>
